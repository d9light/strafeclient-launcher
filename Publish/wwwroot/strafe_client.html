<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strafe Client</title>
    <!-- Importando Poppins do Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-base: #13131A;
            --bg-surface: rgba(30, 30, 46, 0.6);
            --action-color: #8B5CF6;
            --action-glow: rgba(139, 92, 246, 0.4);
            --text-main: #E2E8F0;
            --text-muted: #94A3B8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            position: relative;
        }

        /* Background Dinâmico (Placeholder) com desfoque e escurecimento */
        .bg-image {
            position: absolute;
            top: -20px;
            left: -20px;
            right: -20px;
            bottom: -20px;
            background-image: url('https://images.unsplash.com/photo-1605806616949-1e87b487cb2a?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            filter: blur(8px) brightness(0.4);
            z-index: -1;
        }

        /* Layout Principal */
        .app-container {
            display: flex;
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 1;
        }

        /* Sidebar - Glassmorphism */
        .sidebar {
            width: 80px;
            height: 100%;
            background: var(--bg-surface);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 0;
            gap: 40px;
        }

        .logo-placeholder {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--action-color), #4c1d95);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.2rem;
            color: white;
            box-shadow: 0 0 15px var(--action-glow);
            margin-bottom: 20px;
        }

        .nav-items {
            display: flex;
            flex-direction: column;
            gap: 25px;
            width: 100%;
            align-items: center;
        }

        .nav-icon {
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .nav-icon svg {
            width: 24px;
            height: 24px;
            transition: all 0.3s ease;
        }

        .nav-icon:hover {
            color: var(--action-color);
            background: rgba(139, 92, 246, 0.1);
        }

        .nav-icon.active {
            color: var(--action-color);
            position: relative;
        }

        .nav-icon.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            height: 20px;
            width: 3px;
            background: var(--action-color);
            border-radius: 0 4px 4px 0;
            box-shadow: 0 0 10px var(--action-glow);
        }

        /* Área Principal */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            padding: 30px;
        }

        /* Top Bar & Profile Panel */
        .top-bar {
            display: flex;
            justify-content: flex-end;
            width: 100%;
        }

        .profile-panel {
            display: flex;
            align-items: center;
            gap: 15px;
            background: var(--bg-surface);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 10px 20px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .profile-panel:hover {
            transform: translateY(-2px);
            border-color: rgba(139, 92, 246, 0.3);
        }

        .profile-info {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .profile-name {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .profile-ping {
            font-size: 0.75rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .ping-dot {
            width: 6px;
            height: 6px;
            background-color: #10B981; /* Verde */
            border-radius: 50%;
            box-shadow: 0 0 8px #10B981;
        }

        .profile-avatar {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            object-fit: cover;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Centro da Tela (Títulos) */
        .center-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .main-title {
            font-size: 4rem;
            font-weight: 800;
            letter-spacing: -1px;
            background: linear-gradient(to bottom right, #ffffff, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            filter: drop-shadow(0 4px 15px rgba(0,0,0,0.5));
        }

        .subtitle {
            font-size: 1.1rem;
            color: var(--text-muted);
            font-weight: 500;
            max-width: 500px;
        }

        /* Botão Jogar na área inferior central */
        .bottom-area {
            display: flex;
            justify-content: center;
            padding-bottom: 20px;
        }

        .btn-play {
            background: rgba(19, 19, 26, 0.8);
            backdrop-filter: blur(5px);
            border: 1px solid var(--action-color);
            color: var(--text-main);
            padding: 20px 80px;
            font-size: 1.4rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            overflow: hidden;
            outline: none;
        }

        .btn-play::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--action-color);
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: -1;
        }

        .btn-play:hover {
            color: white;
            box-shadow: 0 0 25px var(--action-glow), inset 0 0 15px var(--action-glow);
            transform: translateY(-2px);
        }

        .btn-play:hover::before {
            opacity: 0.2; /* Preenchimento leve */
        }
        
        .btn-play:active {
            transform: translateY(1px) scale(0.98);
        }
    </style>
</head>
<body>

    <div class="bg-image"></div>

    <div class="app-container">
        
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo-placeholder">S</div>
            
            <div class="nav-items">
                <!-- Ícone Início (Ativo) -->
                <div class="nav-icon active" title="Início">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                </div>
                <!-- Ícone Mods -->
                <div class="nav-icon" title="Mods">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
                </div>
                <!-- Ícone Skins -->
                <div class="nav-icon" title="Skins">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                </div>
                <!-- Ícone Otimização -->
                <div class="nav-icon" title="Otimização">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            
            <!-- Header Panel -->
            <header class="top-bar">
                <div class="profile-panel">
                    <div class="profile-info">
                        <span class="profile-name">Vitor</span>
                        <div class="profile-ping">
                            <div class="ping-dot"></div> Ping: 12ms
                        </div>
                    </div>
                    <img src="https://mc-heads.net/avatar/Vitor/80" alt="Vitor Avatar" class="profile-avatar">
                </div>
            </header>

            <!-- Center Decorative Area -->
            <div class="center-area">
                <h1 class="main-title">STRAFE CLIENT</h1>
                <p class="subtitle">Desempenho extremo e FPS otimizado para a melhor experiência competitiva.</p>
            </div>

            <!-- Bottom Action Area -->
            <div class="bottom-area">
                <button class="btn-play">JOGAR</button>
            </div>

        </main>
    </div>

</body>
</html>
